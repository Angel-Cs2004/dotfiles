# Pantalla de bloqueo (hyprlock). Colores: hyprlock-colors.conf (generado con el fondo)
source = ~/.config/hypr/hyprlock-colors.conf
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = suave, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, suave
    animation = fadeOut, 1, 5, suave
    animation = inputFieldDots, 1, 2, suave
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Hora
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font Bold
    color = $fg
    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %d de %B"
    font_size = 18
    font_family = $font
    color = $fg_dim
    position = 0, 70
    halign = center
    valign = center
}

# Contraseña
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 18
    inner_color = $bg
    outer_color = $border
    check_color = $accent
    fail_color = rgb(ff5d73)
    font_color = $fg
    font_family = $font
    placeholder_text = <span foreground="##ffffff99">Contraseña…</span>
    fail_text = Contraseña incorrecta
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text =   $USER
    font_size = 13
    font_family = $font
    color = $fg_dim
    position = 0, -105
    halign = center
    valign = center
}
