# Pantalla de bloqueo (hyprlock).
# Colores: hyprlock-colors.conf (del fondo) · Tamaños: hyprlock-layout.conf (por monitor)
source = ~/.config/hypr/hyprlock-colors.conf
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = suave, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, suave
    animation = fadeOut, 1, 5, suave
    animation = inputFieldDots, 1, 2, suave
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Hora, fecha, usuario y contraseña: tamaños calculados para cada monitor
# (los genera hyprlock-layout.py antes de bloquear)
source = ~/.config/hypr/hyprlock-layout.conf
