# Busca la versión de .NET 8 instalada (antes estaba fija en 8.0.28 y se rompía al actualizar)
[Service]
ExecStart=
ExecStart=/bin/sh -c 'deps=$(ls -d /usr/share/dotnet/shared/Microsoft.NETCore.App/8.*/Microsoft.NETCore.App.deps.json 2>/dev/null | sort -V | tail -n1); [ -n "$deps" ] && export DOTNET_ADDITIONAL_DEPS="$deps"; exec otd-daemon'
# Si el daemon se cae por un error, volver a levantarlo (sin él la tableta no funciona,
# porque OpenTabletDriver desactiva el controlador wacom del kernel)
Restart=on-failure
RestartSec=3
